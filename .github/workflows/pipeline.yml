name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PYTHONPATH: airflow
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/jobflow-data-pipeline-airflow
  CODE_PATHS: airflow/dags airflow/scripts airflow/tasks
  DBT_PROJECT_DIR: airflow/dbt_jobflow

jobs:
  # ==================== CODE QUALITY ====================
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.8.4

      - name: Check Python formatting with Ruff
        continue-on-error: true
        run: python -m ruff format --check ${{ env.CODE_PATHS }}

      - name: Lint Python code with Ruff
        continue-on-error: true
        run: python -m ruff check ${{ env.CODE_PATHS }}

      - name: Compile Python files
        run: python -m compileall -q ${{ env.CODE_PATHS }}

  # ==================== UNIT TESTS ====================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-cov

      - name: Run tests with pytest
        run: |
          python -m pytest \
            --cov=airflow \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ==================== DBT VALIDATION ====================
  dbt-validation:
    name: Validate dbt Project
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dbt dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Parse dbt project
        run: |
          dbt parse \
            --project-dir ${{ env.DBT_PROJECT_DIR }} \
            --profiles-dir ${{ env.DBT_PROJECT_DIR }} \
            --target local

  # ==================== DEPENDENCY SCANNING ====================
  dependencies:
    name: Security & Dependencies Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit

      - name: Scan Python code with Bandit
        continue-on-error: true
        run: bandit -r airflow -x airflow/scripts/tests,airflow/scripts/demo

      - name: Audit Python dependencies
        continue-on-error: true
        run: pip-audit -r requirements.txt

  # ==================== DOCKER BUILD ====================
  build:
    name: Build Airflow Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, dbt-validation]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== COMPOSE VALIDATION ====================
  compose-validation:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

  # ==================== DAG VALIDATION (AIRFLOW) ====================
  validate-dags:
    name: Validate Airflow DAGs
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check DAG import errors
        run: |
          export AIRFLOW_HOME="${{ runner.temp }}/airflow"
          airflow db migrate
          python - <<'PY'
          from airflow.models.dagbag import DagBag

          dag_bag = DagBag(dag_folder="airflow/dags", include_examples=False)

          if dag_bag.import_errors:
              print("Airflow DAG import errors found:")
              for file_path, error in dag_bag.import_errors.items():
                  print(f"\n{file_path}\n{error}")
              raise SystemExit(1)

          print(f"Airflow DAG import validation passed. Loaded {len(dag_bag.dags)} DAGs.")
          PY

  # ==================== PIPELINE STATUS ====================
  notify:
    name: Pipeline Status
    runs-on: ubuntu-latest
    needs: [lint, test, dbt-validation, dependencies, build, compose-validation, validate-dags]
    if: always()

    steps:
      - name: Check workflow status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "Pipeline failed. Check the failed jobs above."
            exit 1
          fi

          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Pipeline was cancelled."
            exit 1
          fi

          echo "Pipeline passed successfully."
