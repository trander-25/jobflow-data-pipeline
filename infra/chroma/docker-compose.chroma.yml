services:
  chroma:
    image: chromadb/chroma:${CHROMA_VERSION:-1.5.2}
    container_name: chroma
    restart: unless-stopped
    environment:
      CHROMA_PORT: ${CHROMA_PORT:-8000}
      CHROMA_LISTEN_ADDRESS: ${CHROMA_LISTEN_ADDRESS:-0.0.0.0}
      CHROMA_PERSIST_PATH: ${CHROMA_PERSIST_PATH:-/data}
      CHROMA_ALLOW_RESET: ${CHROMA_ALLOW_RESET:-false}
    ports:
      - "${CHROMA_HOST_PORT:-8000}:${CHROMA_PORT:-8000}"
    volumes:
      - chroma_data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/${CHROMA_PORT:-8000}"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  chroma_data:
    name: ${CHROMA_VOLUME_NAME:-jobflow_chroma_data}
