services:
  redis:
    image: redis:${REDIS_VERSION:-7.4.9-alpine}
    container_name: redis
    restart: always
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
