[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "infra/airflow/dbt_jobflow",
    "logs",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["infra/airflow/scripts/tests"]
python_files = ["test_*.py"]
pythonpath = ["infra/airflow"]
addopts = [
    "-ra",
]
